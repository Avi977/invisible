# Tag-triggered release pipeline for Invisible desktop app
#
# Source-of-truth design decisions:
#   .planning/workstreams/tauri-windows/phases/INV-03-release-workflow-auto-updater/03-CONTEXT.md
#
# Before the FIRST release, the user must add these secrets at
# https://github.com/Avi977/invisible/settings/secrets/actions
#
#   TAURI_SIGNING_PRIVATE_KEY           — contents of ~/.tauri/invisible.key
#                                         (also stored in Infisical at
#                                         project=invisible-tauri, env=prod,
#                                         key=TAURI_UPDATER_PRIVATE_KEY).
#                                         See INFISICAL-MANUAL-ACTION.md.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — empty (we generated the key with
#                                         no password); this secret can be
#                                         omitted entirely.
#
# Releases are created as DRAFT — they require an explicit "Publish" click
# in the GitHub UI before they become visible to end users. This is the
# safety gate against accidental tag pushes.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend-vite/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        working-directory: ./frontend-vite
        run: pnpm install --frozen-lockfile

      - name: Build + publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Invisible ${{ github.ref_name }}

            **macOS users:** The `.dmg` is unsigned (we don't pay for an Apple Developer
            certificate). First-launch will show a Gatekeeper warning — right-click the
            `.app` → Open, OR run from terminal:
            `xattr -dr com.apple.quarantine /Applications/Invisible.app`
            (See the project README "Installation (macOS)" section for details.)

            **Windows users:** The `.exe` is unsigned. Windows SmartScreen may warn —
            click "More info" → "Run anyway".

            **Auto-updater:** Future releases will be picked up automatically by
            previously-installed versions via `latest.json`.

            See assets below for installers (`.dmg` for macOS, `.exe` for Windows).
          prerelease: false
          draft: true
          args: ${{ matrix.args }}
