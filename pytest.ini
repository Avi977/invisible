[pytest]
# Marker registration: --strict-markers (in addopts) promotes unknown markers
# to test errors so we never silently typo a marker name.
markers =
    vps_integration: marks tests that require a live srv982719 SSH connection (skipped without --integration)

# --strict-markers   — unknown @pytest.mark.* becomes an error, not a warning
# -ra                — short summary for non-pass test outcomes (skipped, xfailed, etc.)
addopts = --strict-markers -ra

# Default test discovery roots.
testpaths = tests
